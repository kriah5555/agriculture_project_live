<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Version — ArkaShine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width:480px;">
  <div class="card shadow-sm text-center">
    <div class="card-body p-5">
      <div class="mb-3">
        <i class="fas fa-trash-alt fa-3x text-danger"></i>
      </div>
      <h5 class="fw-bold mb-2">Delete Version</h5>
      <p class="text-muted mb-4">
        Are you sure you want to delete version
        <strong class="text-dark">{{ version.version }}</strong>?
        <br><small>This will also permanently delete the uploaded file.</small>
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
          <button type="submit" class="btn btn-danger">
            <i class="fas fa-trash-alt me-1"></i> Yes, Delete
          </button>
          <a href="{% url 'version_list' %}" class="btn btn-outline-secondary">
            <i class="fas fa-times me-1"></i> Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
