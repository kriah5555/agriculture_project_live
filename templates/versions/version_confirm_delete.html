<div style="max-width:500px; margin:60px auto; font-family:Arial, sans-serif;
            background:#fff; padding:30px; border-radius:8px;
            box-shadow:0 6px 18px rgba(0,0,0,0.12); text-align:center;">

    <h2 style="margin-top:0; color:#b71c1c; margin-bottom:15px;">
        Delete Version
    </h2>

    <p style="font-size:15px; color:#333; margin-bottom:25px;">
        Are you sure you want to delete
        <b style="color:#000;">{{ version.version }}</b>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit"
                style="background:#d32f2f; color:#fff; border:none;
                       padding:10px 18px; font-size:14px;
                       border-radius:5px; cursor:pointer;">
            Yes, Delete
        </button>

        <a href="{% url 'version_list' %}"
           style="margin-left:15px; text-decoration:none;
                  color:#555; font-size:14px;">
            Cancel
        </a>
    </form>

</div>
