{% load static  %}
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>RegistrationForm_v10 by Colorlib</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="{% static 'theme/theme.js' %}"></script>

		<!-- LINEARICONS -->
		<link rel="stylesheet" href="{% static '/register/fonts/linearicons/style.css' %}">

		<!-- STYLE CSS -->
		<link rel="stylesheet" href="{% static '/register/css/style.css' %}">

		<!-- FONT AWESOME -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

		<!-- SHARED THEME (dark mode + responsive) -->
		<link rel="stylesheet" href="{% static 'theme/theme.css' %}" />
	</head>

	<body>

		<button type="button" class="theme-toggle-btn theme-toggle-fixed" title="Toggle dark mode">
			<i data-theme-icon class="fas fa-moon"></i>
		</button>

		<!-- success message -->
		{% if messages %}
		{% for message in messages %}
			<div class="alert alert-dismissible alert-faile">
			<strong>{{message}}</strong>
			</div>
		{% endfor %}
		{% endif %}

		<div class="wrapper">
			<div class="inner">
				<a href="{% url 'dashboard' %}"><img src="{% static '/register/images/image-1.png' %}" alt="" class="image-1"></a>
				<form action="" method="POST"> {% csrf_token %}
					<h3>{% if field %} Edit {% else %} Add {% endif %} Field</h3>
					
					<div class="form-holder">
						<span class="lnr lnr-book"></span>
						<input type="field" class="form-control" placeholder="Field name" name = 'field'>
					</div>
					<!-- <button	on>
						<span>Submit</span>
					</button> -->
					<input type="submit" value="Save" style="border: none;
					width: 100%;
					height: 49px;
					margin-top: 50px;
					cursor: pointer;
					display: flex;
					align-items: center;
					justify-content: center;
					padding: 0;
					background: #99ccff;
					color: #fff;
					text-transform: uppercase;
					font-family: 'Muli-SemiBold';
					font-size: 15px;
					letter-spacing: 2px;
					transition: all 0.5s;
					position: relative;
					overflow: hidden;">
				</form>
				<img src="{% static '/register/images/image-2.png' %}" alt="" class="image-2">
			</div>
			
		</div>
		
		<script src="js/jquery-3.3.1.min.js"></script>
		<script src="js/main.js"></script>
	</body><!-- This templates was made by Colorlib (https://colorlib.com) -->
</html>
