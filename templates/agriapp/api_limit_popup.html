<!-- API Threshold Modal — included in devise_details1.html -->

<style>
  .threshold-field { position: relative; }
  .threshold-field .color-dot {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block; margin-right: 6px;
  }
  .threshold-hint { font-size: 11px; color: #888; margin-top: 3px; }
  .threshold-order-error { display: none; font-size: 12px; color: #dc3545; margin-top: 6px; }
</style>

<!-- Trigger: keep same JS API so devise_details1.html doesn't need changes -->
<div class="modal fade" id="apiThresholdModal" tabindex="-1" aria-labelledby="apiThresholdModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 480px;">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden;">

      <!-- Header -->
      <div class="modal-header text-white" style="background: linear-gradient(135deg, #1a73e8, #0d47a1); border-bottom: none; padding: 18px 24px;">
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-sliders-h fa-lg"></i>
          <h5 class="modal-title mb-0 fw-bold" id="apiThresholdModalLabel">API Threshold Limits</h5>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body" style="padding: 24px;">
        <p class="text-muted mb-4" style="font-size: 13px;">
          Set alert levels for API call count. Values must follow:
          <strong>Red &gt; Orange &gt; Blue &gt; Green</strong>
        </p>

        <form id="api-threshold-form">
          {% csrf_token %}

          <!-- Red -->
          <div class="mb-3 threshold-field">
            <label class="form-label fw-semibold" style="font-size: 14px;">
              <span class="color-dot" style="background:#dc3545;"></span> Red (Hard limit)
            </label>
            <input type="number" id="red" class="form-control" min="1" value="100"
                   style="border-left: 4px solid #dc3545;"
                   oninput="syncAndValidate()">
            <div class="threshold-hint">API calls are blocked when this limit is reached.</div>
          </div>

          <!-- Orange -->
          <div class="mb-3 threshold-field">
            <label class="form-label fw-semibold" style="font-size: 14px;">
              <span class="color-dot" style="background:#fd7e14;"></span> Orange (Warning)
            </label>
            <input type="number" id="orange" class="form-control" min="1" value="80"
                   style="border-left: 4px solid #fd7e14;"
                   oninput="syncAndValidate()">
            <div class="threshold-hint">High usage alert.</div>
          </div>

          <!-- Blue -->
          <div class="mb-3 threshold-field">
            <label class="form-label fw-semibold" style="font-size: 14px;">
              <span class="color-dot" style="background:#0d6efd;"></span> Blue (Moderate)
            </label>
            <input type="number" id="blue" class="form-control" min="1" value="50"
                   style="border-left: 4px solid #0d6efd;"
                   oninput="syncAndValidate()">
            <div class="threshold-hint">Moderate usage indicator.</div>
          </div>

          <!-- Green -->
          <div class="mb-3 threshold-field">
            <label class="form-label fw-semibold" style="font-size: 14px;">
              <span class="color-dot" style="background:#198754;"></span> Green (Low usage)
            </label>
            <input type="number" id="green" class="form-control" min="1" value="20"
                   style="border-left: 4px solid #198754;"
                   oninput="syncAndValidate()">
            <div class="threshold-hint">Low usage indicator.</div>
          </div>

          <div id="threshold-order-error" class="threshold-order-error">
            <i class="fas fa-exclamation-triangle me-1"></i>
            Values must follow: Red &gt; Orange &gt; Blue &gt; Green
          </div>

          <div id="form-error" class="text-danger mt-2" style="font-size: 13px; display:none;"></div>
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer border-0" style="padding: 16px 24px; background: #f8f9fa;">
        <button type="button" class="btn btn-outline-secondary btn-sm px-4" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" id="saveThresholdBtn" class="btn btn-primary btn-sm px-4" onclick="submitThreshold()">
          <i class="fas fa-save me-1"></i> Save Limits
        </button>
      </div>

    </div>
  </div>
</div>

<script>
  let currentDeviseId = null;

  function showFormPopup(devise_id, devise_details) {
    currentDeviseId = devise_id;

    if (devise_details) {
      ['red', 'orange', 'blue', 'green'].forEach(function(id) {
        if (devise_details[id] !== undefined) {
          document.getElementById(id).value = devise_details[id];
        }
      });
    }

    document.getElementById('form-error').style.display           = 'none';
    document.getElementById('threshold-order-error').style.display = 'none';

    var modal = new bootstrap.Modal(document.getElementById('apiThresholdModal'));
    modal.show();
  }

  function hideFormPopup() {
    var modal = bootstrap.Modal.getInstance(document.getElementById('apiThresholdModal'));
    if (modal) modal.hide();
  }

  function syncAndValidate() {
    var red    = parseInt(document.getElementById('red').value)    || 0;
    var orange = parseInt(document.getElementById('orange').value) || 0;
    var blue   = parseInt(document.getElementById('blue').value)   || 0;
    var green  = parseInt(document.getElementById('green').value)  || 0;

    var invalid = !(red > orange && orange > blue && blue > green);
    var errEl   = document.getElementById('threshold-order-error');
    var saveBtn = document.getElementById('saveThresholdBtn');
    errEl.style.display  = invalid ? 'block' : 'none';
    saveBtn.disabled     = invalid;
  }

  async function submitThreshold() {
    var red    = parseInt(document.getElementById('red').value);
    var orange = parseInt(document.getElementById('orange').value);
    var blue   = parseInt(document.getElementById('blue').value);
    var green  = parseInt(document.getElementById('green').value);

    if (!(red > orange && orange > blue && blue > green)) {
      document.getElementById('threshold-order-error').style.display = 'block';
      return;
    }

    var errEl = document.getElementById('form-error');
    errEl.style.display = 'none';

    try {
      var response = await fetch('/api-threshold/' + currentDeviseId + '/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({ red: red, orange: orange, blue: blue, green: green })
      });

      var data = await response.json();

      if (response.ok) {
        hideFormPopup();
        location.reload();
      } else {
        errEl.textContent    = data.error || 'Failed to save thresholds.';
        errEl.style.display  = 'block';
      }
    } catch (err) {
      errEl.textContent   = 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
    }
  }

  function getCSRFToken() {
    var name    = 'csrftoken';
    var cookies = document.cookie.split(';');
    for (var i = 0; i < cookies.length; i++) {
      var parts = cookies[i].trim().split('=');
      if (parts[0] === name) return decodeURIComponent(parts[1]);
    }
    return '';
  }
</script>
