{% load static %}

<header>
    <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
</header>


<!------ Include the above in your HEAD tag ---------->
 <!-- navbar -->
 <h4 class="bg-success" style="width: 100%;">{{message}}</h4>
 <nav class="navbar fixed-top navbar-expand navbar-dark" style="background-color: #55779f;">
     <div class="container-fluid">
         <a class="navbar-brand" href="{% url 'dashboard' %}" title="ArkaShine Innovations" style="min-width:0; padding:4px 0;">
             <span style="display:inline-flex; align-items:center; background:#fff; border-radius:8px; padding:4px 10px; box-shadow:0 1px 4px rgba(0,0,0,.18); max-width:100%;"><img src="{% static 'brand/arkashine-wordmark.png' %}" alt="ArkaShine" height="26" style="height:26px; width:auto; max-width:100%; display:block;"></span>
         </a>
             <ul class="navbar-nav ml-auto">
                  <li class="nav-item">
                     <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                 </li>
             </ul>
     </div>
 </nav>
<!-- end navbar -->

<form method="post" class="" style="margin-top: 100px;"> 
  {% csrf_token %} 
  {{ form.as_p }} 
  <input type="submit" value="Save"> 
</form>
