{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArkaShine - User Login</title>
  <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'login.css' %}">
  <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
  <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</head>
<body>
<section class="login-block" style="height: 100vh;">
  <div class="container" style="padding-top: 80px;">
    <div class="row">
      <div class="col-md-4 login-sec">
        <h2 class="text-center">User Login</h2>
        <form action="#" class="login-form" method="POST">
          {% csrf_token %}
          {% if error %}
          <div class="alert alert-danger text-center" role="alert">
            {{ error }}
          </div>
          {% endif %}
          <div class="form-group">
            <label for="username" class="text-uppercase">Username</label>
            <input id="username" name="username" type="text" class="form-control" placeholder="" required>
          </div>
          <div class="form-group">
            <label for="password" class="text-uppercase">Password</label>
            <input id="password" name="password" type="password" class="form-control" placeholder="" required>
          </div>
          <div class="form-group text-right">
            <button type="submit" class="btn btn-login">Login</button>
          </div>
        </form>
        <div class="copy-text">Welcome to ArkaShine</div>
      </div>
      <div class="col-md-8 banner-sec">
        <img class="d-block img-fluid w-100" src="{% static 'login/images/login.jpg' %}" alt="ArkaShine Login" style="height: 100vh; object-fit: cover;">
      </div>
    </div>
  </div>
</section>
</body>
</html>
