{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="{% static 'theme/theme.js' %}"></script>
    <style>
        body{
            font-family: 'Ropa Sans', sans-serif;
            margin-top: 30px;
            background-color: #F0CA00;
            background-color: #F3661C;
            text-align: center;
            color: #fff;
            }
            .error-heading{
            margin: 50px auto;
            width: 250px;
            border: 5px solid #fff;
            font-size: 126px;
            line-height: 126px;
            border-radius: 30px;
            text-shadow: 6px 6px 5px #000;
            }
            .error-heading img{
            width: 100%;
            }
            .error-main h1{
            font-size: 72px;
            margin: 0px;
            color: #F3661C;
            text-shadow: 0px 0px 5px #fff;
            }
    </style>
<link href="https://fonts.googleapis.com/css?family=Ropa+Sans" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="{% static 'theme/theme.css' %}" />
</head>
<body>
<div class="error-main">
<h1>Oops!</h1>
<div class="error-heading">!</div>
<p>You do not have permission to access the page.</p>
{% block content %}
{% endblock %}
</div>
</body>
</html>
