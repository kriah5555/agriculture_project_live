{% load i18n_strings %}{# Language switcher (active languages). Optional: with lang_switch_class="..." for extra classes. #}
<nav class="i18n-switch {{ lang_switch_class }}" aria-label="Language">
  {% for l in languages %}<a href="{% lang_url l.code %}" lang="{{ l.code }}" hreflang="{{ l.code }}"
     class="{% if l.code == lang_code %}active{% endif %}"{% if l.code == lang_code %} aria-current="true"{% endif %}
     title="{{ l.name }}">{% if l.code == 'en' %}EN{% else %}{{ l.native_name }}{% endif %}</a>{% endfor %}
</nav>
<style>
  .i18n-switch{display:inline-flex;background:var(--tc-surface,#fff);border:1px solid #c8e6c9;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);
    font-family:'Segoe UI',Arial,var(--i18n-fonts,sans-serif),sans-serif;}
  .i18n-switch a{padding:7px 11px;font-size:13px;font-weight:600;color:var(--tc-text,#1a3c14);text-decoration:none;line-height:1.2;white-space:nowrap;}
  .i18n-switch a+a{border-left:1px solid #c8e6c9;}
  .i18n-switch a:hover{background:rgba(46,125,50,.10);}
  .i18n-switch a.active{background:#1a3c14;color:#fff;}
  @media print{.i18n-switch{display:none!important;}}
</style>
